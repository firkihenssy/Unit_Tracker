<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Unit Tracker — Assignments</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 32px auto; padding: 0 16px; }
    form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    input, select, button { padding: 7px 10px; font-size: 14px; }
    #errorMsg { color: #b91c1c; margin-bottom: 10px; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #ddd; text-align: left; }
    .done { text-decoration: line-through; color: #777; }
  </style>
</head>
<body>
  <h1>Assignments</h1>

  <form id="assignmentForm">
    <input type="text" id="titleInput" placeholder="Assignment title" required />
    <input type="date" id="dueDateInput" required />
    <select id="unitSelect">
      <option value="">No unit</option>
    </select>
    <button type="submit">Add</button>
  </form>

  <p id="errorMsg"></p>

  <table>
    <thead>
      <tr>
        <th>Done</th>
        <th>Title</th>
        <th>Due Date</th>
        <th>Unit</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="assignmentsBody"></tbody>
  </table>

  <script src="assignments.js"></script>
</body>
</html>
